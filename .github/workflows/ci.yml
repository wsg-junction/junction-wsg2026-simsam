name: CI

on:
  push:
    branches: [main]
  pull_request:

# Where the jobs run is one setting: the repository variable CI_RUNNER
# (Settings > Secrets and variables > Actions > Variables).
#   unset          GitHub-hosted runners (ubuntu-latest)
#   craci          CRACI runners (the "Set up CRACI" step then provides Docker and ssh)
# Any other runner label works too.
jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    concurrency: deploy
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      REGISTRY: vccr.io/${{ vars.VERDA_PROJECT_ID }}
      IMAGE: vccr.io/${{ vars.VERDA_PROJECT_ID }}/simsam:${{ github.sha }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      # CRACI runners need this for a full GitHub-style image with Docker and ssh.
      - name: Set up CRACI
        if: vars.CI_RUNNER == 'craci'
        uses: cracicorp/setup@v1
        with:
          image: ubuntu-24.04

      - uses: actions/checkout@v4

      # Install and build here, on the runner, and let the image just copy the result in
      # (Dockerfile.ci): on CRACI the runner trusts CRACI's HTTPS proxy, a Docker build step doesn't.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build -w web

      - name: Build and push image
        id: image
        env:
          REGISTRY_USER: ${{ secrets.VERDA_REGISTRY_USER }}
          REGISTRY_SECRET: ${{ secrets.VERDA_REGISTRY_SECRET }}
        run: |
          echo "$REGISTRY_SECRET" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker build -f Dockerfile.ci --build-arg BUILD_SHA="${{ github.sha }}" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "$IMAGE" .
          docker push "$IMAGE"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to Verda instance
        run: |
          scp deploy/compose.yml deploy/Caddyfile "$DEPLOY_TARGET:/opt/simsam/"
          ssh "$DEPLOY_TARGET" "cd /opt/simsam \
            && sed -i '/^APP_IMAGE=/d' .env \
            && echo 'APP_IMAGE=$IMAGE' >> .env \
            && docker compose pull app \
            && docker compose up -d \
            && docker image prune -f"

  # Record what the shipped image is made of (its SBOM) in the app: the Health page,
  # MariaDB and search. Generates the SBOM from the image with syft (CycloneDX JSON),
  # then posts it to the running app. Needs APP_URL and SBOM_INGEST_TOKEN.
  # A failure here never blocks anything.
  sbom:
    needs: deploy
    if: vars.APP_URL != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    env:
      REGISTRY: vccr.io/${{ vars.VERDA_PROJECT_ID }}
      IMAGE: vccr.io/${{ vars.VERDA_PROJECT_ID }}/simsam:${{ github.sha }}
    steps:
      - name: Set up CRACI
        if: vars.CI_RUNNER == 'craci'
        uses: cracicorp/setup@v1
        with:
          image: ubuntu-24.04

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Log in to registry
        env:
          REGISTRY_USER: ${{ secrets.VERDA_REGISTRY_USER }}
          REGISTRY_SECRET: ${{ secrets.VERDA_REGISTRY_SECRET }}
        run: echo "$REGISTRY_SECRET" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Generate SBOM from image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "$IMAGE" -o cyclonedx-json > sbom.cdx.json

      - name: Record the SBOM
        env:
          APP_URL: ${{ vars.APP_URL }}
          SBOM_FILE: sbom.cdx.json
          SBOM_INGEST_TOKEN: ${{ secrets.SBOM_INGEST_TOKEN }}
        run: node scripts/publish-sbom.mjs
