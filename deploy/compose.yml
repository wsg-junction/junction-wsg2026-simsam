# Production stack on the Verda instance (copied to /opt/simsam by CI).
# Needs /opt/simsam/.env with DOMAIN, DB_PASSWORD and DB_ROOT_PASSWORD (and optionally
# NVIDIA_API_KEY for AI answers); CI sets APP_IMAGE.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://simsam:${DB_PASSWORD}@db:3306/simsam
      # Optional: without it the app answers from Wikipedia text only.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # Optional: web search (context.dev) for context beyond Wikipedia.
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      # Optional: read compact briefs aloud with ElevenLabs.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      ELEVENLABS_STT_MODEL_ID: ${ELEVENLABS_STT_MODEL_ID:-}
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: simsam
      MARIADB_USER: simsam
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  caddy-data:
  caddy-config:
